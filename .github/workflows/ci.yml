name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    name: build-e-testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar o Gradle (com cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Compilar, testar e gerar cobertura
        run: ./gradlew build

  origem-da-main:
    name: origem-da-main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: PR para a main só pode vir da develop
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "PR para a main só pode vir da develop (veio de: $HEAD_REF)"
            exit 1
          fi
          echo "Origem ok: develop"
